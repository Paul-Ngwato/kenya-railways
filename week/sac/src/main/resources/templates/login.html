<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Login')}"></head>
<body>
<div class="auth-wrap">
  <div class="auth-card auth-card--minimal">
    <div class="auth-logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
        <polyline points="10 17 15 12 10 7"/>
        <line x1="15" y1="12" x2="3" y2="12"/>
      </svg>
    </div>

    <h1 class="auth-title">Sign in</h1>
    <p class="auth-sub">Smart Academic Companion — bring your words, data, and teams together.</p>

    <p class="flash err" th:if="${param.error}">Invalid username/email or password.</p>
    <p class="flash ok" th:if="${param.registered}">Account created — please log in.</p>
    <p class="flash ok" th:if="${param.logout}">You have been logged out.</p>

    <form th:action="@{/login}" method="post" class="auth-form">
      <div class="input-icon">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect width="20" height="16" x="2" y="4" rx="2"/>
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
        </svg>
        <input id="username" name="username" type="text" required autofocus
               autocomplete="username" placeholder="Username or email"
               aria-label="Username or email"/>
      </div>

      <div class="input-icon">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <input id="password" name="password" type="password" required
               autocomplete="current-password" placeholder="Password" aria-label="Password"/>
        <button type="button" class="pw-toggle" data-target="password"
                onclick="togglePw(this)">Show</button>
      </div>

      <div class="auth-row-between">
        <span class="auth-link auth-link--muted" title="Password resets are handled by your administrator">Forgot password?</span>
      </div>

      <button class="btn btn--grad" type="submit">Sign in</button>

      <div class="auth-divider"><span>new here?</span></div>

      <a th:href="@{/register}" class="btn btn--ghost">Create an account</a>
    </form>
  </div>
</div>

<script>
  function togglePw(btn) {
    const input = document.getElementById(btn.dataset.target);
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    btn.textContent = show ? 'Hide' : 'Show';
  }
</script>
</body>
</html>
